                    setTimeout(() => { isDragStarted = false; }, 100);
                });
                
                div.addEventListener('click', (e) => {
                    // 如果是拖拽操作，不显示配方
                    if (isDragStarted) {
                        return;
                    }
                    // 阻止事件冒泡，避免触发其他点击事件
                    e.stopPropagation();
                    showRecipeTooltip(word, e);
                });
                
                div.addEventListener('dragstart', handleDragStart);
                container.appendChild(div);
            });
        }
        
        // ============== 拖拽功能 ==============
        function initDragAndDrop() {
            // 只处理合成槽位（slot1和slot2），忽略其他slot
            const slot1 = document.getElementById('slot1');
            const slot2 = document.getElementById('slot2');
            const fusionSlots = [slot1, slot2];
            
            fusionSlots.forEach((slot, index) => {
                if (!slot) return;
                
                slot.addEventListener('dragover', e => {
                    e.preventDefault();
                    slot.style.borderColor = 'rgba(157, 150, 167, 0.8)';
                    // 如果槽位中已有物资，使用等级颜色的hover版本；否则使用默认hover颜色
                    const wordId = slot.dataset.wordId ? parseInt(slot.dataset.wordId, 10) : null;
                    if (wordId) {
                        const word = playerWords.find(w => Number(w.id) === wordId);
                        if (word) {
                            const levelHoverColor = getLevelHoverColor(word.level || 1);
                            slot.style.backgroundColor = levelHoverColor.replace('0.9', '0.6');
                        } else {
                            slot.style.backgroundColor = 'rgba(235, 230, 235, 0.6)';
                        }
                    } else {
                        slot.style.backgroundColor = 'rgba(235, 230, 235, 0.6)';
                    }
                });
                
                slot.addEventListener('dragleave', () => {
                    slot.style.borderColor = '#b8b3b5';
                    // 如果槽位中已有物资，保持等级颜色；否则恢复默认颜色
                    const wordId = slot.dataset.wordId ? parseInt(slot.dataset.wordId, 10) : null;
                    if (wordId) {
                        const word = playerWords.find(w => Number(w.id) === wordId);
                        if (word) {
                            const levelColor = getLevelColor(word.level || 1);
                            slot.style.backgroundColor = levelColor.replace('0.7', '0.5');
                        } else {
                            slot.style.backgroundColor = 'rgba(220, 217, 212, 0.4)';
                        }
                    } else {
                        slot.style.backgroundColor = 'rgba(220, 217, 212, 0.4)';
                    }
                });
                
                slot.addEventListener('drop', e => {
                    e.preventDefault();
                    const wordId = e.dataTransfer.getData('text/plain');
                    
                    // 确保wordId有效
                    if (!wordId || wordId === '') {
                        console.error('无效的物资ID');
                        return;
                    }
                    
                    // 确保ID类型一致（转换为数字进行比较，因为word.id是数字）
                    const wordIdNum = parseInt(wordId, 10);
                    if (isNaN(wordIdNum)) {
                        console.error('无法解析物资ID:', wordId);
                        return;
                    }
                    
                    // 使用严格数字匹配查找物资（确保找到正确的物资，即使名称相同）
                    const word = playerWords.find(w => Number(w.id) === wordIdNum);
                    
                    if (word) {
                        // 检查物资是否已被使用
                        if (usedWordIds.has(wordIdNum)) {
                            showToast('该物资已被使用，请先清空其他位置', 'warning');
                            return;
                        }
                        
                        // 如果这个槽位之前有物资，先取消之前的标记
                        if (selectedWords[index]) {
                            const oldWordId = selectedWords[index].id;
                            usedWordIds.delete(oldWordId);
                        }
                        
                        // 标记新物资为已使用
                        usedWordIds.add(wordIdNum);
                        // 确保使用找到的物资对象，而不是通过其他方式获取
                        selectedWords[index] = word;
                        slot.innerHTML = `
                            <div>${word.emoji} ${word.text} (Lv${word.level || 1})</div>
                        `;
                        slot.style.borderColor = 'rgba(157, 150, 167, 0.8)';
                        // 根据物资等级设置槽位背景颜色（使用稍低的透明度以保持可见性）
                        const levelColor = getLevelColor(word.level || 1);
                        slot.style.background = levelColor.replace('0.7', '0.5');
                        // 保存wordId到slot的dataset，以便在dragleave时使用
                        slot.dataset.wordId = wordIdNum;
                    } else {
                        console.error('找不到物资，wordId:', wordId, 'wordIdNum:', wordIdNum);
                        alert(`无法找到物资（ID: ${wordId}），请重试。`);
                    }
                });
            });
    
            // 行动槽位的拖拽处理
            const actionSlot = document.getElementById('action-slot');
            if (actionSlot) {
                actionSlot.addEventListener('dragover', (e) => {
                e.preventDefault();
                    actionSlot.style.borderColor = 'rgba(168, 181, 160, 0.8)';
                    // 如果行动槽位中已有物资，使用等级颜色的hover版本；否则使用默认hover颜色
                    const wordId = actionSlot.dataset.wordId ? parseInt(actionSlot.dataset.wordId, 10) : null;
                    if (wordId) {
                        const word = playerWords.find(w => Number(w.id) === wordId);
                        if (word) {
                            const levelHoverColor = getLevelHoverColor(word.level || 1);
                            actionSlot.style.background = levelHoverColor.replace('0.9', '0.6');
                        } else {
                            actionSlot.style.background = 'rgba(230, 235, 230, 0.5)';
                        }
                    } else {
                        actionSlot.style.background = 'rgba(230, 235, 230, 0.5)';
                    }
            });
            
                actionSlot.addEventListener('dragleave', () => {
                    actionSlot.style.borderColor = '#a8b5a0';
                    // 如果行动槽位中已有物资，保持等级颜色；否则恢复默认颜色
                    const wordId = actionSlot.dataset.wordId ? parseInt(actionSlot.dataset.wordId, 10) : null;
                    if (wordId) {
                        const word = playerWords.find(w => Number(w.id) === wordId);
                        if (word) {
                            const levelColor = getLevelColor(word.level || 1);
                            actionSlot.style.background = levelColor.replace('0.7', '0.5');
                        } else {
                            actionSlot.style.background = 'rgba(220, 217, 212, 0.4)';
                        }
                    } else {
                        actionSlot.style.background = 'rgba(220, 217, 212, 0.4)';
                    }
            });
            
                actionSlot.addEventListener('drop', (e) => {
                e.preventDefault();
                    actionSlot.style.borderColor = '#a8b5a0';
                    actionSlot.style.background = 'rgba(220, 217, 212, 0.4)';
                    
                    if (actionPoints <= 0) {
                        alert('今日行动点已用完，无法再执行行动。请结束今天。');
                        return;
                    }
                
                const wordId = e.dataTransfer.getData('text/plain');
                    
                    // 确保wordId有效
                    if (!wordId || wordId === '') {
                        console.error('无效的物资ID');
                        return;
                    }
                    
                    // 确保ID类型一致（转换为数字进行比较，因为word.id是数字）
                    const wordIdNum = parseInt(wordId, 10);
                    if (isNaN(wordIdNum)) {
                        console.error('无法解析物资ID:', wordId);
                        return;
                    }
                    
                    // 检查物资是否已被使用
                    if (usedWordIds.has(wordIdNum)) {
                        alert('该物资已被使用，请先清空其他位置！');
                        return;
                    }
                    
                    // 使用严格匹配查找物资
                    const word = playerWords.find(w => Number(w.id) === wordIdNum);
                
                    if (word) {
                        // 如果行动槽位之前有物资，先取消之前的标记
                        if (actionSlotItem) {
                            const oldWordId = actionSlotItem.id;
                            usedWordIds.delete(oldWordId);
                        }
                        
                        // 标记新物资为已使用
                        usedWordIds.add(wordIdNum);
                        
                        // 确保使用找到的物资，而不是之前的值
                        actionSlotItem = word;
                        // 根据物资等级设置行动槽位背景颜色
                        const levelColor = getLevelColor(word.level || 1);
                        actionSlot.style.background = levelColor.replace('0.7', '0.5');
                        actionSlot.dataset.wordId = wordIdNum;
                        actionSlot.innerHTML = `
                            <div style="font-size: 16px; font-weight: 500; color: #5a5753;">
                                ${word.emoji} ${word.text}
                        </div>
                        `;
                        showActionMenu(word);
                    } else {
                        console.error('找不到物资，wordId:', wordId, 'wordIdNum:', wordIdNum);
                        console.log('当前物资库:', playerWords.map(w => ({id: w.id, text: w.text})));
                        alert(`无法找到物资（ID: ${wordId}），请重试。`);
                }
            });
            }
        }
        
        function handleDragStart(e) {
            // 使用currentTarget确保获取到正确的元素（包含dataset.wordId的div）
            // 因为事件监听器绑定在div上，currentTarget应该就是那个div
            const target = e.currentTarget;
            let wordId = target.dataset.wordId;
            
            // 如果当前元素没有wordId，向上查找
            if (!wordId) {
                const closest = target.closest('[data-word-id]');
                if (closest && closest.dataset.wordId) {
                    wordId = closest.dataset.wordId;
                }
            }
            
            if (wordId) {
                // 确保wordId是字符串格式，并清除可能的空白字符
                const cleanWordId = String(wordId).trim();
                const wordIdNum = parseInt(cleanWordId, 10);
                
                // 检查物资是否已被使用
                if (usedWordIds.has(wordIdNum)) {
                    e.preventDefault();
                    alert('该物资已被使用，请先清空其他位置！');
                    return;
                }
                
                e.dataTransfer.setData('text/plain', cleanWordId);
            } else {
                console.error('无法找到物资ID:', {
                    target: target,
                    dataset: target.dataset,
                    closest: target.closest('[data-word-id]')
                });
            }
            }
            
        // 显示行动选择菜单

                        <div style="font-weight: 500; margin-bottom: 2px; color: #5a5753;">${action.name}</div>

        // 执行行动：应用数值变化 + AI反馈
        async function executeAction(actionKey, item) {
            const action = ACTION_TYPES[actionKey];
            if (!action) return;
            const tag = item.tag || 'material';
            // 行为校验
            if (actionKey === 'craftTool' && tag !== 'material') { 
                showToast('制作工具只能使用原材料类物资', 'error', '操作失败'); 
                return; 
            }
            if (actionKey === 'eat' && tag !== 'food') { 
                showToast('进食只能使用食物类物资', 'error', '操作失败'); 
                return; 
            }
            if (actionKey === 'buildShelter' && tag !== 'material') { 
                showToast('修建庇护所只能使用原材料类物资', 'error', '操作失败'); 
                return; 
            }
            // 打猎/钓鱼/砍伐需要工具类物资，但反射信号板虽然是material也可以用于打猎（布置陷阱）
            if (actionKey === 'huntFish' && tag !== 'tool' && item.text !== '反射信号板') { 
                showToast('打猎/钓鱼/砍伐需要工具类物资', 'error', '操作失败'); 
                return; 
            }
            
            // 消耗行动点（进食行动不消耗行动点）
            if (actionKey !== 'eat') {
                if (actionPoints <= 0) { alert('今日行动点已用完'); return; }
                actionPoints -= 1;
                actionPointCounter += 1;
                // 每消耗3行动点换一次天气
                if (actionPointCounter >= 3) {
                    await changeWeather(); // 等待天气切换完成，确保使用最新天气数据
                }
                updateDayAndActionUI();
            }
            
            // 禁用所有行动按钮并显示加载状态
            const actionMenu = document.getElementById('action-menu');
            const actionButtons = actionMenu ? actionMenu.querySelectorAll('button') : [];
            const originalButtonStates = [];
            actionButtons.forEach((btn, index) => {
                originalButtonStates[index] = {
                    disabled: btn.disabled,
                    innerHTML: btn.innerHTML,
                    opacity: btn.style.opacity,
                    cursor: btn.style.cursor
                };
                btn.disabled = true;
                if (btn.innerHTML.includes(action.emoji)) {
                    btn.innerHTML = `⏳ ${action.name}中...`;
                }
                btn.style.opacity = '0.6';
                btn.style.cursor = 'not-allowed';
            });
            
            // 先计算系统默认的数值变化（按物资等级调整）
            const lvl = item.level || 1;
            let defaultChanges = {};
            
            if (actionKey === 'eat') {
                // 进食逻辑：系统规定的固定数值，有合理梯度
                // 一级食物：生的或难咽下的，效果差
                if (lvl === 1) {
                    defaultChanges = { survival: +4 };
                } else if (lvl === 2) {
                    // 二级食物：简单处理过的，效果一般
                    defaultChanges = { survival: +13 };
                } else if (lvl === 3) {
                    // 三级食物：较好处理的，效果不错
                    defaultChanges = { survival: +21 };
                } else {
                    // 四级食物：精心制作的，效果很好
                    defaultChanges = { survival: +30 };
                }
            } else if (actionKey === 'huntFish') {
                // 打猎/钓鱼/砍伐：工具等级越高，减少的生存状态值越少
                // Lv1: -10点（上限），Lv2: -7点，Lv3: -4点，Lv4: -2点（下限）
                let survivalLoss = 10;
                if (lvl === 1) {
                    survivalLoss = 10; // 上限
                } else if (lvl === 2) {
                    survivalLoss = 7;
                } else if (lvl === 3) {
                    survivalLoss = 4;
                } else {
                    survivalLoss = 2; // 下限（Lv4及以上）
                }
                defaultChanges = {
                    survival: -survivalLoss
                };
            } else {
                // 其他行动：按等级放大
                const factor = 1 + 0.5 * (lvl - 1); // Lv1=1.0, Lv4=2.5
                defaultChanges = {
                    survival: Math.round((action.statChanges.survival || 0) * factor)
                };
            }
            
            // 先按配方表生成物资（制作工具和捕猎/钓鱼），然后再调用AI
            let newItem = null;
            let newItemBlock = '';
            
            // 按类别消耗输入物资
            if (actionKey === 'craftTool' || actionKey === 'buildShelter') {
                if (tag === 'material') consumeItem(item, 1);
            } else if (actionKey === 'eat') {
                if (tag === 'food') consumeItem(item, item.usesLeft || 1);
            } else if (actionKey === 'huntFish') {
                // 打猎/钓鱼/砍伐使用工具，消耗1次使用次数
                if (tag === 'tool') consumeItem(item, 1);
            }

            // 检查天气影响
            const isAffectedByWeather = checkWeatherImpact(actionKey);
            let weatherSuccess = true;
            let isDoubleReward = false;
            
            if (isAffectedByWeather) {
                // 30%失败率
                weatherSuccess = Math.random() < 0.7;
                if (weatherSuccess) {
                    // 成功则双倍收益
                    isDoubleReward = true;
                }
            }
            
            // 按配方表生成物资（制作工具和捕猎/钓鱼）
            let actionFailed = false; // 标记行动是否因天气失败
            if (actionKey === 'craftTool') {
                if (!weatherSuccess && isAffectedByWeather) {
                    // 天气影响导致失败，不生成物资
                    actionFailed = true;
                    newItem = null;
                    newItemBlock = '';
                } else {
                    const recipe = findCraftToolRecipe(item);
                    if (!recipe) {
                        alert(`无法用【${item.text}】制作工具！`);
                        actionPoints += 1; // 返还行动点
                        updateDayAndActionUI();
                        return;
                    }
                    const resultInfo = MATERIAL_DATABASE[recipe.result];
                    if (!resultInfo) {
                        alert(`配方错误：找不到物资【${recipe.result}】的信息！`);
                        actionPoints += 1; // 返还行动点
                        updateDayAndActionUI();
                        return;
                    }
                    // 产物等级：严格按照MATERIAL_DATABASE中定义的等级
                    const resultLevel = resultInfo.level || 1;
                    newItem = {
                        id: getNextWordId(),
                        text: recipe.result,
                        emoji: resultInfo.emoji,
                        tag: resultInfo.tag,
                        level: resultLevel,
                        usesLeft: defaultUses(resultInfo.tag),
                        effects: {}
                    };
                    // 先添加第一个物资，确保ID正确分配
                    playerWords.push(newItem);
                    // 双倍收益：额外获得一个（在第一个物资添加后，getNextWordId会返回新的ID）
                    if (isDoubleReward) {
                        const extraItem = {
                            id: getNextWordId(),
                            text: recipe.result,
                            emoji: resultInfo.emoji,
                            tag: resultInfo.tag,
                            level: resultLevel,
                            usesLeft: defaultUses(resultInfo.tag),
                            effects: {}
                        };
                        playerWords.push(extraItem);
                    }
                    renderWordInventory();
                    newItemBlock = `<p style="margin-bottom: 6px;"><strong>获得物资：</strong>${newItem.emoji} ${newItem.text} (Lv${resultLevel}·${tagLabel(resultInfo.tag)})${isDoubleReward ? ' x2（天气加成）' : ''}</p>`;
                }
            } else if (actionKey === 'huntFish') {
                if (!weatherSuccess && isAffectedByWeather) {
                    // 天气影响导致失败，不生成物资
                    actionFailed = true;
                    newItem = null;
                    newItemBlock = '';
                } else {
                    const recipe = findHuntFishRecipe(item);
                    if (!recipe) {
                        alert(`无法用【${item.text}】进行打猎/钓鱼/砍伐！`);
                        actionPoints += 1; // 返还行动点
                        updateDayAndActionUI();
                        return;
                    }
                    const resultInfo = MATERIAL_DATABASE[recipe.result];
                    if (!resultInfo) {
                        alert(`配方错误：找不到物资【${recipe.result}】的信息！`);
                        actionPoints += 1; // 返还行动点
                        updateDayAndActionUI();
                        return;
                    }
                    // 产物等级：严格按照MATERIAL_DATABASE中定义的等级
                    const resultLevel = resultInfo.level || 1;
                    newItem = {
                        id: getNextWordId(),
                        text: recipe.result,
                        emoji: resultInfo.emoji,
                        tag: resultInfo.tag,
                        level: resultLevel,
                        usesLeft: defaultUses(resultInfo.tag),
                        effects: {}
                    };
                    // 先添加第一个物资，确保ID正确分配
                    playerWords.push(newItem);
                    // 双倍收益：额外获得一个（在第一个物资添加后，getNextWordId会返回新的ID）
                    if (isDoubleReward) {
                        const extraItem = {
                            id: getNextWordId(),
                            text: recipe.result,
                            emoji: resultInfo.emoji,
                            tag: resultInfo.tag,
                            level: resultLevel,
                            usesLeft: defaultUses(resultInfo.tag),
                            effects: {}
                        };
                        playerWords.push(extraItem);
                    }
                    renderWordInventory();
                    newItemBlock = `<p style="margin-bottom: 6px;"><strong>获得物资：</strong>${newItem.emoji} ${newItem.text} (Lv${resultLevel}·${tagLabel(resultInfo.tag)})${isDoubleReward ? ' x2（天气加成）' : ''}</p>`;
                }
            }

            // 判断行动是否失败（包括修建庇护所的情况）
            const isActionFailed = actionFailed || (actionKey === 'buildShelter' && isAffectedByWeather && !weatherSuccess);
            
            // 所有行动都使用系统规定的数值，不使用AI返回的数值
            let finalSurvivalDelta = typeof defaultChanges.survival === 'number' && !isNaN(defaultChanges.survival) && isFinite(defaultChanges.survival) ? defaultChanges.survival : 0;
            
            // 打猎/钓鱼/砍伐行动不准增加生存状态值
            if (actionKey === 'huntFish' && finalSurvivalDelta > 0) {
                finalSurvivalDelta = 0; // 强制设为0，不允许增加
            }
            
            // 打猎/钓鱼/砍伐行动扣减生存状态值限制在2-10点之间
            if (actionKey === 'huntFish' && finalSurvivalDelta < 0) {
                const totalSurvivalLoss = Math.abs(finalSurvivalDelta);
                if (totalSurvivalLoss > 10) {
                    finalSurvivalDelta = -10; // 限制最大扣减为10点（上限）
                } else if (totalSurvivalLoss < 2) {
                    finalSurvivalDelta = -2; // 限制最小扣减为2点（下限）
                }
            }
                
            const finalChanges = {
                survival: finalSurvivalDelta
            };
            
            // 进食增加行动点：4级食物+3点，3级食物+2点，2级食物+1点，1级食物+0点
            if (actionKey === 'eat') {
                let actionPointGain = 0;
                if (lvl === 4) {
                    actionPointGain = 3;
                } else if (lvl === 3) {
                    actionPointGain = 2;
                } else if (lvl === 2) {
                    actionPointGain = 1;
                } else {
                    actionPointGain = 0;
                }
                actionPoints = Math.min(MAX_ACTION_POINTS, actionPoints + actionPointGain);
                updateDayAndActionUI();
            }
            const nonZeroChanges = applyStatChanges(finalChanges);
            // 处理修建庇护所的坚固值增加（由系统根据物资等级计算）
            let shelterChangeText = '';
            
            // 处理修建庇护所：直接根据物资等级计算坚固值增加
            if (actionKey === 'buildShelter') {
                const itemLevel = item.level || 1;
                // 根据等级计算增加的坚固值：Lv1=5, Lv2=10, Lv3=15, Lv4=25
                let baseDelta = 0;
                if (itemLevel === 1) {
                    baseDelta = 5;
                } else if (itemLevel === 2) {
                    baseDelta = 10;
                } else if (itemLevel === 3) {
                    baseDelta = 15;
                } else if (itemLevel >= 4) {
                    baseDelta = 25;
                }
                
                // 处理天气影响
                if (isAffectedByWeather) {
                if (!weatherSuccess) {
                    // 失败：不增加庇护所坚固值
                    actionFailed = true;

        // 生成行动失败描述
        async function generateActionFailureDescription(action, item, weather) {
            try {
                const response = await fetchWithTimeout(LLM_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${LLM_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: LLM_MODEL_NAME,
                        messages: [
                            {
                                role: "system",
                                content: `荒岛求生叙事者。${playerName ? `玩家：${playerName}，用${playerName}作主语。` : '用"玩家"作主语。'}返回JSON：{"description":"40-60字描述因${weather}天气导致${action.name}失败"}`
                            },
                            {
                                role: "user",
                                content: `${playerName || '玩家'}用${item.text}进行${action.name}，因${weather}失败。生成简短描述。`
                            }
                        ],
                        temperature: 0.2, 
                        max_tokens: 50, 
                        response_format: { "type": "json_object" }
                    })
                }, 20000); // 减少超时时间以加快响应（20秒）
                
                if (!response.ok) throw new Error(`AI描述生成失败: ${response.status}`);
                const data = await response.json();
                const parsed = safeParseJSON(data.choices[0].message.content);
                
                const defaultDesc = playerName
                    ? `由于${weather}天气的影响，${playerName}的${action.name}行动失败了。`
                    : `由于${weather}天气的影响，你的${action.name}行动失败了。`;
                return {
                    description: replaceYouWithPlayerName(parsed.description || defaultDesc),
                    survivalDelta: null,
                    sturdyDelta: 0,
                    rainDelta: 0
                };
            } catch (error) {
                console.error('生成失败描述失败:', error);
                const defaultDesc = playerName
                    ? `由于${weather}天气的影响，${playerName}的${action.name}行动失败了。恶劣的天气条件让${playerName}无法完成这次行动。`
                    : `由于${weather}天气的影响，你的${action.name}行动失败了。恶劣的天气条件让你无法完成这次行动。`;
                return {
                    description: defaultDesc,
                    survivalDelta: null,
                    sturdyDelta: 0,
                    rainDelta: 0
                };
            }
        }
        
        // 调用AI生成行动描述（必要时返回物资名）
        async function generateActionDescription(action, item, resultItem = null) {
            try {
                // 构建系统提示词（简化版以加快生成速度）
                const playerNamePart = playerName ? `${playerName}` : '玩家';
                let systemPrompt = `荒岛求生叙事者。${playerNamePart}作主语。返回JSON：{"description":"40-60字行动描述"}。数值由系统计算，只生成描述。`;

                // 判断行动类型对应的key
                let actionTypeKey = '';
                if (action.name === '制作工具') actionTypeKey = 'craftTool';
                else if (action.name === '打猎/钓鱼/砍伐') actionTypeKey = 'huntFish';
                else if (action.name === '修建庇护所') actionTypeKey = 'buildShelter';
                else if (action.name === '寻找物资') actionTypeKey = 'searchLocation';
                
                const isWeatherAffected = checkWeatherImpact(actionTypeKey);
                
                // 简化用户提示词以加快生成速度
                let userPrompt = `${action.name}：用${item.text}${resultItem ? `获得${resultItem.text}` : ''}。天气：${currentWeather}${isWeatherAffected ? '（受影响）' : ''}。生成简短描述。`;

                const response = await fetchWithTimeout(LLM_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${LLM_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: LLM_MODEL_NAME,
                        messages: [
                            {
                                role: "system",
                                content: systemPrompt
                            },
                            {
                                role: "user",
                                content: userPrompt
                            }
                        ],
                        temperature: 0.2, 
                        max_tokens: 50, 
                        response_format: { "type": "json_object" }
                    })
                }, 20000); // 减少超时时间以加快响应（20秒）
                
                if (!response.ok) throw new Error(`AI描述生成失败: ${response.status}`);
                const data = await response.json();
                const parsed = safeParseJSON(data.choices[0].message.content);
                
                // AI只返回描述文本，所有数值变化由系统计算
                return {
                    description: replaceYouWithPlayerName(parsed.description || ''),
                    healthDelta: null,
                    hungerDelta: null,
                    sturdyDelta: 0,
                    rainDelta: 0
                };
            } catch (error) {
                const defaultDesc = playerName 
                    ? `${playerName}用${item.text}完成了${action.name}，虽然过程艰难，但总算有所收获。`
                    : `你用${item.text}完成了${action.name}，虽然过程艰难，但总算有所收获。`;
                return {
                    description: defaultDesc,
                    survivalDelta: null,
                    sturdyDelta: 0,
                    rainDelta: 0
                };
            }
        }

                return;
            }
            if (fusionLeft <= 0) {

            const recipe = findRecipe(word1, word2);

                return;
            }
            
            // 获取结果物资信息
            const resultInfo = MATERIAL_DATABASE[recipe.result];

         * @param {boolean} useDeduplication - 是否启用请求去重（默认true）
         */
        async function fetchWithTimeout(url, options, timeout = 30000, useDeduplication = true) {
            // 如果启用去重，检查是否有相同的请求正在进行
            if (useDeduplication) {
                const requestKey = getRequestKey(url, options);
                
                // 如果有相同的请求正在进行，复用该请求
                if (pendingRequests.has(requestKey)) {
                    return await pendingRequests.get(requestKey);
                }
                
                // 创建请求Promise
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                
                const fetchPromise = (async () => {
                    try {
                        const response = await fetch(url, {
                            ...options,
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        pendingRequests.delete(requestKey);
                        return response;
                    } catch (error) {
                        clearTimeout(timeoutId);
                        pendingRequests.delete(requestKey);
                        if (error.name === 'AbortError') {
                            throw new Error(`请求超时（${timeout/1000}秒），请检查网络连接或稍后重试`);
                        }
                        // 处理网络连接错误
                        if (error.message && (error.message.includes('Failed to fetch') || error.message.includes('fetch'))) {
                            throw new Error('网络连接失败，请检查网络连接后重试');
                        }
                        throw error;
                    }
                })();
                
                // 记录正在进行的请求
                pendingRequests.set(requestKey, fetchPromise);
                return fetchPromise;
            } else {
                // 不使用去重，直接请求
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, {
                        ...options,
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    return response;
                } catch (error) {
                    clearTimeout(timeoutId);
                    if (error.name === 'AbortError') {
                        throw new Error(`请求超时（${timeout/1000}秒），请检查网络连接或稍后重试`);
                    }
                    // 处理网络连接错误
                    if (error.message && (error.message.includes('Failed to fetch') || error.message.includes('fetch'))) {
                        throw new Error('网络连接失败，请检查网络连接后重试');
                    }
                    throw error;
                }
            }
        }

        // ============== JSON解析辅助函数 ==============
        /**
         * 安全地解析JSON字符串，处理AI返回的格式问题
         * 支持：代码块包装、数组格式、对象提取等
         */
        function safeParseJSON(jsonString) {
            if (!jsonString || typeof jsonString !== 'string') {
                throw new Error('输入不是有效的字符串');
            }
            
            // 移除可能的代码块标记
            let cleaned = jsonString.trim();
            
            // 尝试提取JSON代码块（如果被```json```包装）
            const jsonBlockMatch = cleaned.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
            if (jsonBlockMatch) {
                cleaned = jsonBlockMatch[1].trim();
            }
            
            // 首先尝试直接解析（如果已经是有效的JSON）
            try {
                return JSON.parse(cleaned);
            } catch (e) {
                // 如果直接解析失败，尝试提取JSON对象
            }
            
            // 尝试提取第一个{...}块（更准确地找到JSON对象）
            const firstBrace = cleaned.indexOf('{');
            if (firstBrace === -1) {
                // 如果没有找到{，尝试查找[（可能是数组）
                const firstBracket = cleaned.indexOf('[');
                if (firstBracket !== -1) {
                    // 处理数组格式
                    let bracketCount = 0;
                    let lastBracket = -1;
                    for (let i = firstBracket; i < cleaned.length; i++) {
                        if (cleaned[i] === '[') bracketCount++;
                        if (cleaned[i] === ']') {
                            bracketCount--;
                            if (bracketCount === 0) {
                                lastBracket = i;
                                break;
                            }
                        }
                    }
                    if (lastBracket !== -1) {
                        try {
                            return JSON.parse(cleaned.substring(firstBracket, lastBracket + 1));
                        } catch (e) {
                            // 继续尝试对象格式
                        }
                    }
                }
                throw new Error('未找到JSON对象开始标记');
            }
            
            // 从第一个{开始，查找匹配的闭合括号（考虑字符串内的转义）
            let braceCount = 0;        // 大括号计数器
            let lastBrace = -1;        // 最后一个匹配的大括号位置
            let inString = false;      // 是否在字符串内
            let escapeNext = false;    // 下一个字符是否被转义
            
            for (let i = firstBrace; i < cleaned.length; i++) {
                const char = cleaned[i];
                
                // 处理转义字符
                if (escapeNext) {
                    escapeNext = false;
                    continue;
                }
                
                if (char === '\\') {
                    escapeNext = true;
                    continue;
                }
                
                // 跟踪字符串边界（字符串内的{和}不应影响计数）
                if (char === '"' && !escapeNext) {
                    inString = !inString;
                    continue;
                }
                
                // 只在非字符串范围内计算大括号
                if (!inString) {
                    if (char === '{') braceCount++;
                    if (char === '}') {
                        braceCount--;
                        if (braceCount === 0) {
                            lastBrace = i;
                            break;
                        }
                    }
                }
            }
            
            if (lastBrace === -1 || lastBrace <= firstBrace) {
                throw new Error('未找到匹配的JSON对象结束标记');
            }
            
            cleaned = cleaned.substring(firstBrace, lastBrace + 1);
            
            try {
                return JSON.parse(cleaned);
            } catch (e) {
                throw new Error(`JSON解析失败: ${e.message}. 这通常是因为AI返回的JSON包含未转义的引号或特殊字符。`);
            }
        }

        // ============== 核心API调用函数 ==============
        async function callLLMFusionAPI(word1, word2, resultName) {
            const requestBody = {
                model: LLM_MODEL_NAME, // 使用配置的模型名
                messages: [
                    {
                        role: "system",
                        content: `荒岛求生描述生成器。${playerName ? `玩家：${playerName}，用${playerName}作主语。` : '用"玩家"作主语。'}返回JSON：{"useDescription":"1-2句话描述用${word1}和${word2}制作${resultName}","note":"一句话说明${resultName}的用途"}`
                    },
                    {
                        role: "user",
                        content: `${playerName || '玩家'}用${word1}和${word2}合成${resultName}。生成简短描述。`
                    }
                ],
                temperature: 0.2, 
                max_tokens: 50, 
                // 多数服务商要求将返回格式设为JSON，但参数名可能是 response_format 或其它，请查阅文档
                response_format: { "type": "json_object" }
        };

    try {
        // 发送请求到代理服务
        const response = await fetchWithTimeout(LLM_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                // 大多数服务商用 'Authorization' 头传递密钥，格式可能是 'Bearer KEY' 或直接是KEY
                'Authorization': `Bearer ${LLM_API_KEY}`,
                // 某些服务商可能有自定义头部，如 'api-key'，请以服务商文档为准
                // 'api-key': LLM_API_KEY
            },
            body: JSON.stringify(requestBody)
        }, 20000); // 减少超时时间以加快响应（20秒）

        // 检查响应状态
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`API请求失败 (状态码: ${response.status}): ${errorText}`);
        }

        // 解析API返回的JSON数据（OpenAI/DeepSeek兼容格式）
        const data = await response.json();
        let resultContent = data.choices[0].message.content;
        
        // 尝试解析content中的JSON字符串（使用安全解析函数）
        const parsedResult = safeParseJSON(resultContent);
        
        // 将解析结果与你原有的游戏数据结构对齐并返回
            const defaultDesc = playerName
                ? `${playerName}使用【${word1}】和【${word2}】制作出了【${resultName}】。`
                : `你使用【${word1}】和【${word2}】制作出了【${resultName}】。`;
        return {
                useDescription: replaceYouWithPlayerName(parsedResult.useDescription || defaultDesc),
                note: replaceYouWithPlayerName(parsedResult.note || '')
        };

    } catch (error) {
        // 提供一个友好的错误回退，防止游戏卡住
        const defaultDesc = playerName
            ? `${playerName}使用${word1}和${word2}制作出了${resultName}。`
            : `你使用${word1}和${word2}制作出了${resultName}。`;
        return {
            useDescription: defaultDesc,
            note: `AI 描述生成出错：${error.message}，下次网络状况好点再试试。`
        };
    }
}

        async function grantAiRewardItem(completedChallengeIndex) {
            try {

                // 第一个挑战（index 0）过后给2级物资
                // 第二、三挑战（index 1, 2）过后给3级物资
                let rewardLevel;
                if (completedChallengeIndex === 0) {
                    rewardLevel = 2; // 第一个挑战后给2级物资
                } else if (completedChallengeIndex === 1 || completedChallengeIndex === 2) {
                    rewardLevel = 3; // 第二、三挑战后给3级物资
                } else {
                    // 第四个挑战（最终挑战）不给奖励，因为游戏结束
                    return;

                let availableItems = Object.entries(MATERIAL_DATABASE)
                    .filter(([name, info]) => info.level === rewardLevel);

                // 直接从地点偏好列表中随机选择物资，不区分稀有度概率
                const preferredItems = location.preferredItems || [];
                
                // 从偏好列表中筛选出在MATERIAL_DATABASE中存在的物资
                const preferredAvailable = preferredItems
                    .filter(name => MATERIAL_DATABASE[name]) // 确保物资存在于数据库中
                    .map(name => [name, MATERIAL_DATABASE[name]]);
                
                // 如果偏好列表中有物资，随机选择；否则从所有物资中随机选择作为回退
                let availableItems;
                if (preferredAvailable.length > 0) {
                    availableItems = preferredAvailable;
                } else {
                    // 回退：从所有物资中随机选择
                    availableItems = Object.entries(MATERIAL_DATABASE);
                }
                
                // 检查天气影响（使用地点特定的判断）
                const isAffectedByWeather = checkLocationWeatherImpact(locationId);
                let weatherSuccess = true;
                let isDoubleReward = false;
                
                if (isAffectedByWeather) {
                    // 30%失败率
                    weatherSuccess = Math.random() < 0.7;
                    if (weatherSuccess) {
                        // 成功则双倍收益
                        isDoubleReward = true;

                // 如果天气影响导致失败，不生成物资
                if (!weatherSuccess && isAffectedByWeather) {
                    // 消耗行动点
                    actionPoints -= 1;
                    actionPointCounter += 1;
                    // 每消耗3行动点换一次天气
                    if (actionPointCounter >= 3) {
                        await changeWeather(); // 等待天气切换完成，确保使用最新天气数据

                    // 失败时也扣减生存状态值（因为天气恶劣且没找到物资，消耗更多体力）

                // 随机选择一个物资
                const [itemName, itemInfo] = availableItems[Math.floor(Math.random() * availableItems.length)];
                const name = itemName;

        // ============== 游戏结束与性格评语 ==============
        function calcFinalScore() {
            // 简单评分：当前两项平均值 + 合成次数奖励
            const avgStat = survival;
            const fusionScore = fusionResults.length * 5;
            return Math.round(avgStat + fusionScore);
        }

        async function generateEndingSummary(success) {
            // 找到玩家拥有过的最高级食物（当前拥有的和曾经合成过的）
            let highestFoodLevel = 0;
            let highestFoodName = '基础食物';
            
            // 先检查当前拥有的食物
            playerWords.forEach(w => {
                if (w.tag === 'food' && w.level && w.level > highestFoodLevel) {
                    highestFoodLevel = w.level;
                    highestFoodName = w.text;
                }
            });
            
            // 再检查曾经合成过的食物（从合成记录中查找）
            fusionResults.forEach(r => {
                const itemInfo = MATERIAL_DATABASE[r.itemName];
                if (itemInfo && itemInfo.tag === 'food' && itemInfo.level && itemInfo.level > highestFoodLevel) {
                    highestFoodLevel = itemInfo.level;
                    highestFoodName = r.itemName;
                }
            });

            // 统计工具和材料数量
            const toolCount = playerWords.filter(w => w.tag === 'tool').length;
            const materialCount = playerWords.filter(w => w.tag === 'material').length;
            const totalItems = playerWords.length;

            try {
                const response = await fetchWithTimeout(LLM_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${LLM_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: LLM_MODEL_NAME,
                        messages: [
                            {
                                role: "system",
                                content: `荒岛求生叙事者。${success ? '生成成功结局结语和身份。' : '生成失败结局结语。'}${playerName ? `玩家：${playerName}，用${playerName}作主语。` : '用"玩家"作主语。'}返回JSON：${success ? '{"summary":"150-200字结语，描述获救后的新生活，根据逃生天数评价玩家能力（越早越厉害），融入最高食物、庇护所等信息","identity":"逃出后的职业身份，如：厨师、冒险家、求生教练等，根据玩家表现个性化生成"}' : '{"summary":"150-200字结语，描述最后的时刻"}'}`
                            },
                            {
                                role: "user",
                                content: `玩家：${playerName || '玩家'}。逃生天数：第${currentDay}天（游戏共7天，越早逃生越厉害）。最高食物：${highestFoodName}(Lv${highestFoodLevel})。庇护所坚固值：${shelterDurability}。工具数量：${toolCount}。材料数量：${materialCount}。总物资数：${totalItems}。${success ? '成功获救。请生成详细的结语和逃出后的身份。' : '失败。请生成结语。'}`
                            }
                        ],
                        temperature: 0.5, // 提高温度以获得更好的创意
                        max_tokens: 400, // 增加token数量以支持更长的结语
                        response_format: { "type": "json_object" }
                    })
                }, 20000); // 减少超时时间以加快响应（20秒）

                if (!response.ok) throw new Error(`生成总结失败: ${response.status}`);
                const data = await response.json();
                const parsed = safeParseJSON(data.choices[0].message.content);
                
                // 确保使用玩家名字替换
                const summary = replaceYouWithPlayerName(parsed.summary || (success 
                    ? (playerName ? `${playerName}成功获救，开始了新的生活。这段经历让${playerName}更加珍惜每一天。` : '你成功获救，开始了新的生活。这段经历让你更加珍惜每一天。')
                    : (playerName ? `${playerName}没能坚持到最后，在荒岛上结束了生命。` : '你没能坚持到最后，在荒岛上结束了生命。')));
                
                // 返回结语和身份（如果成功）
                if (success) {
                    return {
                        summary: summary,
                        identity: parsed.identity || '荒野生存者'
                    };
                } else {
                    return {
                        summary: summary,
                        identity: null
                    };
                }
            } catch (e) {
                console.error('生成总结失败：', e);
                // 默认文本，使用玩家名字
                const defaultSummary = success
                    ? (playerName ? `${playerName}成功获救，开始了新的生活。这段经历让${playerName}更加珍惜每一天。` : '你成功获救，开始了新的生活。这段经历让你更加珍惜每一天。')
                    : (playerName ? `${playerName}没能坚持到最后，在荒岛上结束了生命。` : '你没能坚持到最后，在荒岛上结束了生命。');
                
                return {
                    summary: defaultSummary,
                    identity: success ? '荒野生存者' : null
                };
            }
        }

            // 显示基础界面，按钮初始状态为"正在生成结语"

                    <div style="font-size: 80px; margin-bottom: 20px;">🤓</div>
                    <h2 style="color: #f87171;">荒岛求生失败</h2>
                    <p style="margin-top:10px;">${reasonText}</p>
                    <div style="margin: 30px 0;">

                            color: white;
                            border: none;
                            padding: 15px 30px;
                            border-radius: 25px;
                            font-size: 18px;

        function countItemsByTag(tag, minLevel = 1) {
            return playerWords.filter(w => w.tag === tag && (w.level || 1) >= minLevel).length;
        }

            const challenge = challenges.find(c => c.day === day);
            if (!challenge) {
                // 普通日子：轻微消耗描述

                    "这一天没有发生什么大事，你只是反复检查营地、摆弄手中的工具，试图让自己看起来没那么无助。");

            }
            
            // 如果挑战已经完成（在完成时已结算），则不再处理

            // 挑战只会在玩家主动完成时结算（通过 checkChallengeCompletion 函数）
        }

        async function endDay() {
            if (isDead()) return;
            
            // 禁用按钮并显示加载状态
            const endDayBtn = document.querySelector('button[onclick="endDay()"]');
            const originalText = endDayBtn ? endDayBtn.innerHTML : '';
            if (endDayBtn) {
                endDayBtn.disabled = true;
                endDayBtn.innerHTML = '⏳ 结算中...';
                endDayBtn.style.opacity = '0.6';
                endDayBtn.style.cursor = 'not-allowed';
            }
            
            // 每天结束时的基础消耗
            // 庇护所坚固值越高，扣减越少
            const shelter = shelterDurability || 0;
            
            // 根据庇护所坚固值计算扣减（0-100范围）
            let survivalLoss;
            let shelterDescription;
            if (shelter >= 80) {
                survivalLoss = 6;
                shelterDescription = "坚固的庇护所为你提供了良好的休息环境，虽然荒岛生活仍然艰苦，但至少能让你安稳地度过夜晚。";
            } else if (shelter >= 60) {
                survivalLoss = 8;
                shelterDescription = "庇护所相当坚固，让你度过了一个相对安稳的夜晚，但仍有一些小问题影响了你的休息质量。";
            } else if (shelter >= 40) {
                survivalLoss = 10;
                shelterDescription = "庇护所提供了基本保护，但仍有一些不便让你难以获得充分的休息，夜晚过得不算舒适。";
            } else if (shelter >= 10) {
                survivalLoss = 13;
                shelterDescription = "庇护所还算基本，但夜晚仍然不够舒适，风吹过缝隙让你辗转难眠，消耗了不少体力。";
            } else {
                survivalLoss = 15;
                shelterDescription = "简陋的庇护所让你一晚上没睡好，被风吹雨打折磨得疲惫不堪，身体消耗巨大。";
            }
            
            applyStatChanges({ survival: -survivalLoss });
            logDayEventToResults("日终消耗",
                `${shelterDescription}<br><strong>数值变化：</strong>庇护所坚固值 ${Math.round(shelterDurability)}，扣除 生存状态值 ${survivalLoss}`);
            if (isDead()) {
                await showGameOverScreen("在日复一日的消耗中，你的身体终于支撑不住。");
                return;
            }

            // 触发当天固定大事件（异步）
            resolveMajorEventForDay(currentDay).then(() => {
                if (isDead()) return;
                if (currentDay >= MAX_DAY) {
                    // 第7天事件已处理完，无论成败游戏都结束
                    // 恢复按钮状态
                    if (endDayBtn) {
                        endDayBtn.disabled = false;
                        endDayBtn.innerHTML = originalText;
                        endDayBtn.style.opacity = '1';
                        endDayBtn.style.cursor = 'pointer';
                    }
                    return;
                }

                // 进入下一天
                currentDay += 1;
                actionPoints = 5; // 每天开始时重置为5点
                fusionLeft += 3; // 每天开始时给3次合成机会
                updateFusionLeftDisplay();
                updateDayAndActionUI();
                updateChallengeDisplay();
                
                // 恢复按钮状态
                if (endDayBtn) {
                    endDayBtn.disabled = false;
                    endDayBtn.innerHTML = originalText;
                    endDayBtn.style.opacity = '1';
                    endDayBtn.style.cursor = 'pointer';
                }
            }).catch((error) => {
                console.error('结算失败:', error);
                // 恢复按钮状态
                if (endDayBtn) {
                    endDayBtn.disabled = false;
                    endDayBtn.innerHTML = originalText;
                    endDayBtn.style.opacity = '1';
                    endDayBtn.style.cursor = 'pointer';
                }
            });
        }
        
        // ============== 添加一些互动效果 ==============
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('word-item')) {
                // 点击词语时的动画
                e.target.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    e.target.style.transform = '';
                }, 150);
            }
        });

    </script>
</body>
</html>
